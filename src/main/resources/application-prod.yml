services:
  postgres:
    image: postgres:16
    container_name: vigenere-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigenere_db}
      POSTGRES_USER: ${POSTGRES_USER:-vigenere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: