<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigenere Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <p class="eyebrow">Шифр Виженера</p>
      <h1>Vigenere Vault</h1>
    </header>

    <nav class="tabs" role="tablist" aria-label="Режим">
      <button class="tab active" type="button" data-tab="encrypt" role="tab" aria-selected="true" id="tab-encrypt">
        <span class="tab-icon" aria-hidden="true">🔐</span>
        Шифрование
      </button>
      <button class="tab" type="button" data-tab="decrypt" role="tab" aria-selected="false" id="tab-decrypt">
        <span class="tab-icon" aria-hidden="true">🔓</span>
        Расшифровка
      </button>
    </nav>

    <!-- Encrypt -->
    <section class="panel card" id="encryptPanel" role="tabpanel" aria-labelledby="tab-encrypt">
      <form id="encryptForm" class="form" novalidate>
        <label class="field">
          <span class="field-label">Текст</span>
          <textarea id="plainText" rows="6" placeholder="Введите текст на латинице, например HELLO WORLD" autocomplete="off"></textarea>
          <span class="field-hint">Шифруются только латинские буквы A–Z</span>
        </label>

        <div class="field">
          <span class="field-label">Ключ</span>
          <div class="input-group">
            <input id="encryptKey" type="text" maxlength="128" placeholder="LEMON" autocomplete="off" />
            <button type="button" class="icon-btn" id="copyEncryptKeyBtn" title="Скопировать ключ" aria-label="Скопировать ключ" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="encryptBtn">
            <span class="btn-text">Зашифровать</span>
            <span class="btn-spinner" hidden aria-hidden="true"></span>
          </button>
          <button class="btn btn-ghost" type="button" id="clearEncryptBtn">Очистить</button>
        </div>
      </form>

      <div id="encryptResult" class="result-block hidden">
        <div class="result-header">
          <span class="field-label">Результат</span>
          <div id="encryptStatusPill" class="status-pill" data-state="IDLE">—</div>
        </div>
        <textarea id="encryptOutput" class="result-text" rows="5" readonly placeholder="Зашифрованный текст появится здесь"></textarea>

        <div id="credentialsCard" class="credentials-card hidden">
          <p class="credentials-title">Сохраните для расшифровки</p>
          <p class="credentials-desc">Понадобятся Job ID и тот же ключ</p>

          <div class="credential-row">
            <span class="credential-label">Job ID</span>
            <div class="credential-value-wrap">
              <code id="credentialJobId" class="credential-value">—</code>
              <button type="button" class="icon-btn copy-btn" data-copy-target="credentialJobId" aria-label="Скопировать Job ID">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>

          <div class="credential-row">
            <span class="credential-label">Ключ</span>
            <div class="credential-value-wrap">
              <code id="credentialKey" class="credential-value">—</code>
              <button type="button" class="icon-btn copy-btn" data-copy-target="credentialKey" aria-label="Скопировать ключ">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>

          <button type="button" class="btn btn-secondary btn-full" id="goToDecryptBtn" disabled>
            Перейти к расшифровке
          </button>
        </div>
      </div>
    </section>

    <!-- Decrypt -->
    <section class="panel card hidden" id="decryptPanel" role="tabpanel" aria-labelledby="tab-decrypt" hidden>
      <form id="decryptForm" class="form" novalidate>
        <div class="field">
          <span class="field-label">Job ID</span>
          <div class="input-group">
            <input id="jobId" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" spellcheck="false" />
            <button type="button" class="icon-btn" id="copyJobIdBtn" title="Скопировать Job ID" aria-label="Скопировать Job ID" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Ключ</span>
          <div class="input-group">
            <input id="decryptKey" type="text" maxlength="128" placeholder="Тот же ключ, что при шифровании" autocomplete="off" />
            <button type="button" class="icon-btn" id="copyDecryptKeyBtn" title="Скопировать ключ" aria-label="Скопировать ключ" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="decryptBtn">
            <span class="btn-text">Расшифровать</span>
            <span class="btn-spinner" hidden aria-hidden="true"></span>
          </button>
          <button class="btn btn-ghost" type="button" id="clearDecryptBtn">Очистить</button>
        </div>
      </form>

      <div id="decryptResult" class="result-block hidden">
        <div class="result-header">
          <span class="field-label">Расшифрованный текст</span>
          <div id="decryptStatusPill" class="status-pill" data-state="IDLE">—</div>
        </div>
        <textarea id="decryptOutput" class="result-text" rows="6" readonly placeholder="Исходный текст появится здесь"></textarea>
        <button type="button" class="btn btn-ghost btn-full copy-output-btn" id="copyDecryptOutputBtn" disabled>
          Скопировать результат
        </button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
