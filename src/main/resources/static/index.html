<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigenere Vault</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=boska@500,700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Vigenere Vault</h1>
    </header>

    <section class="card">
      <div class="tabs" role="tablist" aria-label="Modes">
        <button class="tab active" type="button" data-tab="encrypt" aria-selected="true">Encrypt</button>
        <button class="tab" type="button" data-tab="decrypt" aria-selected="false">Decrypt</button>
      </div>

      <label class="field">
        <span>Base URL</span>
        <input id="baseUrl" type="url" value="http://localhost:8080" placeholder="http://localhost:8080" />
      </label>

      <form id="appForm" class="form" novalidate>
        <div id="encryptMode" class="mode-block">
          <label class="field">
            <span>Text</span>
            <textarea id="plainText" rows="8" placeholder="Enter text"></textarea>
          </label>

          <label class="field">
            <span>Key</span>
            <input id="encryptKey" type="text" maxlength="128" placeholder="LEMON" />
          </label>
        </div>

        <div id="decryptMode" class="mode-block hidden">
          <label class="field">
            <span>Job ID</span>
            <input id="jobId" type="text" placeholder="UUID" />
          </label>

          <label class="field">
            <span>Key</span>
            <input id="decryptKey" type="text" maxlength="128" placeholder="LEMON" />
          </label>
        </div>

        <div class="actions">
          <button id="submitBtn" class="primary-btn" type="submit">Encrypt</button>
          <button id="statusBtn" class="secondary-btn" type="button">Status</button>
          <button id="clearBtn" class="secondary-btn" type="button">Clear</button>
        </div>
      </form>
    </section>

    <section class="card output-card">
      <div class="output-meta">
        <div>
          <span class="meta-label">Status</span>
          <div id="statusPill" class="status-pill" data-state="IDLE">IDLE</div>
        </div>
        <div>
          <span class="meta-label">Job ID</span>
          <div id="currentJobId" class="job-id">—</div>
        </div>
      </div>

      <label class="field">
        <span>Output</span>
        <textarea id="resultBox" rows="10" readonly placeholder="Result"></textarea>
      </label>
    </section>
  </main>
</body>
</html>
