spring:
  application:
    name: vigenereVault
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vigenere_db}
    username: ${DB_USERNAME:vigenere}
    password: ${DB_PASSWORD:vigenere}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}