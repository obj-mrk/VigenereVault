version: '3.9'

services:

  postgres:

    image: postgres:16

    container_name: vigenere-postgres

    environment:
      POSTGRES_DB: vigenere_db
      POSTGRES_USER: vigenere
      POSTGRES_PASSWORD: vigenere

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: